# Shared signing key for login tokens. auth-service signs with it,
# doctor-service and appointment-service only verify.
# The same file is kept in every repo so each can be deployed on its own;
# applying it twice does no harm.
apiVersion: v1
kind: Secret
metadata:
  name: medislot-jwt
  namespace: medislot
type: Opaque
stringData:
  JWT_SECRET: k8s-medislot-jwt-7d41a89f3b2c5e60aa
