apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: medislot
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: medislot/auth-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: TOKEN_EXPIRES_IN
              value: 2h
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medislot-jwt
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: medislot
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 4002
      targetPort: 4002
      nodePort: 30402
