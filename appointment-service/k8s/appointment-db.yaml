apiVersion: v1
kind: Secret
metadata:
  name: appointment-db-secret
  namespace: medislot
type: Opaque
stringData:
  POSTGRES_USER: appt_user
  POSTGRES_PASSWORD: appt_pass
  POSTGRES_DB: appointment_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appointment-db-pvc
  namespace: medislot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-db
  namespace: medislot
  labels:
    app: appointment-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: appointment-db
  template:
    metadata:
      labels:
        app: appointment-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: appointment-db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appt_user", "-d", "appointment_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: appointment-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-db
  namespace: medislot
spec:
  selector:
    app: appointment-db
  ports:
    - port: 5432
      targetPort: 5432
