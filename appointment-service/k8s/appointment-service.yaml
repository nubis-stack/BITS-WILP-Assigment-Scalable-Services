apiVersion: v1
kind: ConfigMap
metadata:
  name: appointment-service-config
  namespace: medislot
data:
  PORT: "5002"
  DB_HOST: appointment-db
  DB_PORT: "5432"
  DB_NAME: appointment_db
  # k8s DNS name of doctor-service inside the cluster
  DOCTOR_SERVICE_URL: http://doctor-service:4001
  DOCTOR_SERVICE_TIMEOUT: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: medislot
  labels:
    app: appointment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-service
          image: medislot/appointment-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef:
                name: appointment-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: appointment-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appointment-db-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medislot-jwt
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 25
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: medislot
spec:
  type: NodePort
  selector:
    app: appointment-service
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30502
