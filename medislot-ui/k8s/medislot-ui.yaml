apiVersion: v1
kind: ConfigMap
metadata:
  name: medislot-ui-config
  namespace: medislot
data:
  PORT: "8080"
  # cluster DNS names of the backend services
  AUTH_SERVICE_URL: http://auth-service:4002
  DOCTOR_SERVICE_URL: http://doctor-service:4001
  APPOINTMENT_SERVICE_URL: http://appointment-service:5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medislot-ui
  namespace: medislot
  labels:
    app: medislot-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medislot-ui
  template:
    metadata:
      labels:
        app: medislot-ui
    spec:
      containers:
        - name: medislot-ui
          image: medislot/medislot-ui:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: medislot-ui-config
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: medislot-ui
  namespace: medislot
spec:
  type: NodePort
  selector:
    app: medislot-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
