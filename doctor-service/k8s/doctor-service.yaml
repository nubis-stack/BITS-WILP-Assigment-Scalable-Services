apiVersion: v1
kind: ConfigMap
metadata:
  name: doctor-service-config
  namespace: medislot
data:
  PORT: "4001"
  DB_HOST: doctor-db
  DB_PORT: "5432"
  DB_NAME: doctor_db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: medislot
  labels:
    app: doctor-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          # image is built inside minikube, see medislot-deploy/LOCAL_SETUP.md
          image: medislot/doctor-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: doctor-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: doctor-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doctor-db-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medislot-jwt
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: medislot
spec:
  type: NodePort
  selector:
    app: doctor-service
  ports:
    - port: 4001
      targetPort: 4001
      nodePort: 30401
